# The plugin supports all types of message formatting.
# LEGACY — Color via & / § and HEX via &#rrggbb / §#rrggbb or &x&r&r&g&g&b&b / §x§r§r§g§g§b§b
# LEGACY_ADVANCED — Color and HEX via &##rrggbb / §##rrggbb
# MINI_MESSAGE — Color via <color> More details — https://docs.advntr.dev/minimessage/index.html
# And all formats available at https://www.birdflop.com/resources/rgb/

# MINI_MESSAGE (RECOMMENDED) — color via <color> More details — https://docs.advntr.dev/minimessage/index.html
# ALL — support for all formats simultaneously. Slower, not all MINI_MESSAGE tags are supported
colorizer: MINI_MESSAGE

plugin:
  # Plugin prefix for regular messages. Use {P} in messages
  prefix: "<gold>NamedChest</gold> <dark_gray>|</dark_gray>"
  # Plugin prefix for error messages. Use {P_E} in messages
  prefix-error: "<red>NamedChest</red> <dark_gray>|</dark_gray>"
  reload: "{P} <gray>The plugin has been successfully <green>reloaded</gray>"
  no-console: "{P_E} <red>This command can only be executed by players</red>"
  no-perms: "{P_E} <red>You do not have permission to use this command</red>"
  command-disable: "{P_E} <red>This command has been disabled by the server administrator</red>"
  cooldown: "{P} <gray>Please wait another <yellow>{COOLDOWN}s</yellow> before using this command again"

version:
  latest: "{P} <gray>You are running the latest version of the plugin: <green>{CURRENT_VERSION}</green></gray>"
  supported: "{P} <gray>You are running a supported version of the plugin (<yellow>{CURRENT_VERSION}</yellow>), however we recommend updating to the latest version (<green>{LATEST_VERSION}</green>)"
  outdated: "{P} <gray>You are running an unsupported version of the plugin (<red>{CURRENT_VERSION}). <bold>WE DO NOT RECOMMEND USING THIS PATCH.</bold></red> Please immediately install the latest version (<green>{LATEST_VERSION}</green>)"
  blacklist: "{P} <gray>You are running a blacklisted version of the plugin (<red>{CURRENT_VERSION}). <bold>WE DO NOT RECOMMEND USING THIS PATCH.</bold></red> Please immediately install the latest version (<green>{LATEST_VERSION}</green>)"
  download: "{P} Download here — <yellow><click:open_url:{DOWNLOAD_LINK}>{DOWNLOAD_LINK}</click></yellow>"
  error: "{P_E} <red>An error occurred while fetching the plugin version. Learn more in the console</red>"
  loading: "{P} <gray>Loading the latest version of the plugin...</gray>"

main-command:
  help: |
    {P} <gray>Plugin command help: 
     <yellow>• <click:suggest_command:/$command set>/$command version</click></yellow> — set a name
     <yellow>• <click:suggest_command:/$command clear>/$command version</click></yellow> — clear a name
     <yellow>• <click:suggest_command:/$command reload>/$command reload</click></yellow> — reload the plugin
     <yellow>• <click:suggest_command:/$command version>/$command version</click></yellow> — get the latest plugin version 
    Contact the developer — <blue><click:open_url:{CONTACT}>{CONTACT}</click></gray>
  set: "{P} <gray>You have successfully set the name '<yellow>{NAME}</yellow>' on block <yellow>{BLOCK}</yellow></gray>"
  clear: "{P} <gray>You have successfully cleared the name of block <yellow>{BLOCK}</yellow></gray>"
  error:
    not-your-region: "{P_E} <red>You are not in your region</red>"
    exceeded-name-length: "{P_E} <red>The name must be no longer than <yellow>{MAX_LENGTH}</yellow> characters</red>"
    empty-name: "{P_E} <red>The name cannot be empty</red>"
    null-block: "{P_E} <red>The block cannot be air</red>"
    unsupported-block: "{P_E} <red>Unsupported block. Use supported blocks:</red> <yellow>{SUPPORTED_BLOCKS}</yellow>"
    cancel-anvil: "{P_E} <red>You cannot rename this block using anvil</red>"
    already-clear: "{P_E} <red>There is no name for this block</red>"